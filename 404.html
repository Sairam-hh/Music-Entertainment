<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Page Not Found | BeatFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{font-family:'Inter',sans-serif;color:#fff;background:#0d0d1a;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Bebas Neue',sans-serif;font-weight:400;line-height:1;letter-spacing:1px}
a{text-decoration:none;color:inherit}

/* BG VIDEO */
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:.18}
.bg-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(10,10,26,.7) 0%,rgba(10,10,26,.98) 100%);z-index:1}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:20px 0}
.nav-wrap{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;display:flex;align-items:center;gap:10px;letter-spacing:2px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#e63946,#ff006e);border-radius:8px;display:grid;place-items:center;font-size:15px;color:#fff}
.nav-cta{display:flex;gap:12px}
.btn-nav-outline{color:#fff;border:1.5px solid rgba(255,255,255,.3);padding:9px 22px;border-radius:25px;font-size:13.5px;font-weight:600;transition:.3s}
.btn-nav-outline:hover{border-color:#e63946;color:#e63946}
.btn-nav-fill{background:linear-gradient(135deg,#e63946,#ff006e);color:#fff;padding:9px 22px;border-radius:25px;font-size:13.5px;font-weight:600;transition:.3s}
.btn-nav-fill:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(230,57,70,.4)}

/* MAIN */
.main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:10;padding:120px 24px 60px;text-align:center}
.content{max-width:820px;width:100%;animation:fadeUp .9s ease}

/* GLITCH 404 */
.glitch-wrap{position:relative;margin-bottom:10px;display:inline-block}
.num-404{font-family:'Bebas Neue',sans-serif;font-size:clamp(140px,22vw,260px);line-height:1;letter-spacing:4px;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.08);position:relative;display:block}
.num-red{position:absolute;inset:0;font-family:'Bebas Neue',sans-serif;font-size:clamp(140px,22vw,260px);line-height:1;letter-spacing:4px;color:#e63946;animation:glitch1 3s infinite;clip-path:polygon(0 30%,100% 30%,100% 55%,0 55%)}
.num-white{position:absolute;inset:0;font-family:'Bebas Neue',sans-serif;font-size:clamp(140px,22vw,260px);line-height:1;letter-spacing:4px;color:#fff;animation:glitch2 3s infinite;clip-path:polygon(0 55%,100% 55%,100% 80%,0 80%)}

/* VINYL */
.vinyl-wrap{width:120px;height:120px;margin:0 auto 30px;position:relative}
.vinyl{width:120px;height:120px;border-radius:50%;background:conic-gradient(from 0deg,#1a1a2e,#16213e,#0f3460,#533483,#e43946,#0f3460,#16213e,#1a1a2e);animation:spin 4s linear infinite paused;box-shadow:0 0 40px rgba(230,57,70,.3);position:relative}
.vinyl.playing{animation-play-state:running}
.vinyl::before{content:'';position:absolute;inset:30%;border-radius:50%;background:#0d0d1a;border:3px solid rgba(255,255,255,.1)}
.vinyl::after{content:'';position:absolute;inset:44%;border-radius:50%;background:#e63946;box-shadow:0 0 10px rgba(230,57,70,.6)}
.vinyl-grooves{position:absolute;inset:8%;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
.vinyl-grooves::before{content:'';position:absolute;inset:15%;display:block;border-radius:50%;border:1px solid rgba(255,255,255,.05)}
.vinyl-grooves::after{content:'';position:absolute;inset:30%;display:block;border-radius:50%;border:1px solid rgba(255,255,255,.04)}
.needle{position:absolute;top:-10px;right:-20px;width:50px;height:50px;transform-origin:right center;animation:needleBob 4s ease-in-out infinite}
.needle svg{width:50px;height:50px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}

/* EQUALIZER BARS */
.eq-bars{display:flex;align-items:flex-end;gap:5px;height:36px;margin:0 auto 30px;width:fit-content}
.eq-bar{width:6px;border-radius:3px;background:linear-gradient(180deg,#e63946,#ff006e);animation:eqAnim 1s ease-in-out infinite alternate}
.eq-bar:nth-child(1){animation-delay:0s;height:14px}
.eq-bar:nth-child(2){animation-delay:.15s;height:28px}
.eq-bar:nth-child(3){animation-delay:.08s;height:20px}
.eq-bar:nth-child(4){animation-delay:.22s;height:36px}
.eq-bar:nth-child(5){animation-delay:.05s;height:22px}
.eq-bar:nth-child(6){animation-delay:.18s;height:16px}
.eq-bar:nth-child(7){animation-delay:.12s;height:30px}

/* TEXT */
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.3);color:#e63946;padding:7px 18px;border-radius:30px;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}
.headline{font-size:clamp(28px,5vw,52px);margin-bottom:16px;line-height:1.05}
.headline span{color:#e63946}
.sub{font-size:clamp(14px,1.5vw,17px);color:rgba(255,255,255,.65);line-height:1.75;margin-bottom:36px;max-width:560px;margin-left:auto;margin-right:auto}

/* SEARCH */
.search-wrap{position:relative;max-width:440px;margin:0 auto 40px}
.search-wrap input{width:100%;padding:16px 56px 16px 20px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font-family:'Inter',sans-serif;font-size:15px;outline:none;transition:.3s;backdrop-filter:blur(10px)}
.search-wrap input::placeholder{color:rgba(255,255,255,.4)}
.search-wrap input:focus{border-color:#e63946;background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(230,57,70,.15)}
.search-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:linear-gradient(135deg,#e63946,#ff006e);border:none;color:#fff;width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.3s}
.search-wrap button:hover{transform:translateY(-50%) scale(1.08)}

/* BUTTONS */
.btn-group{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:50px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:30px;font-weight:700;font-size:14.5px;cursor:pointer;border:none;transition:.3s;font-family:'Inter',sans-serif;letter-spacing:.3px}
.btn-red{background:linear-gradient(135deg,#e63946,#ff006e);color:#fff}
.btn-red:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(230,57,70,.45)}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.25);padding:13px 26px}
.btn-outline:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.5);transform:translateY(-2px);background:#ff006e}


/* QUICK LINKS */
.quick-links{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ql-label{font-size:13px;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:.5px}
.ql-item{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);padding:8px 16px;border-radius:25px;font-size:13px;font-weight:500;color:rgba(255,255,255,.75);transition:.3s;cursor:pointer}
.ql-item:hover{background:rgba(230,57,70,.15);border-color:rgba(230,57,70,.4);color:#fff}
.ql-item i{font-size:12px;color:#e63946}

/* FOOTER STRIP */
.footer-strip{position:relative;z-index:10;border-top:1px solid rgba(255,255,255,.06);padding:20px 24px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:rgba(255,255,255,.35);text-align:center}
.footer-strip a{color:rgba(255,255,255,.5);transition:.2s}
.footer-strip a:hover{color:#e63946}

/* FLOATING NOTES */
.notes-bg{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.note{position:absolute;font-size:20px;color:rgba(230,57,70,.15);animation:floatNote linear infinite}
.note:nth-child(1){left:5%;animation-duration:14s;animation-delay:0s}
.note:nth-child(2){left:15%;animation-duration:18s;animation-delay:2s;font-size:14px}
.note:nth-child(3){left:28%;animation-duration:12s;animation-delay:5s;font-size:24px}
.note:nth-child(4){left:42%;animation-duration:16s;animation-delay:1s}
.note:nth-child(5){left:55%;animation-duration:20s;animation-delay:4s;font-size:16px}
.note:nth-child(6){left:68%;animation-duration:13s;animation-delay:7s;font-size:28px}
.note:nth-child(7){left:78%;animation-duration:17s;animation-delay:3s}
.note:nth-child(8){left:90%;animation-duration:15s;animation-delay:6s;font-size:12px}

/* WAVEFORM BOTTOM */
.waveform{position:fixed;bottom:0;left:0;right:0;z-index:2;opacity:.12;pointer-events:none}
.waveform svg{width:100%;height:80px;display:block}

/* KEYFRAMES */
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes glitch1{0%,100%{transform:translate(0);opacity:1}20%{transform:translate(-3px,1px);opacity:.9}40%{transform:translate(3px,-2px);opacity:1}60%{transform:translate(-2px,2px);opacity:.85}80%{transform:translate(2px,-1px);opacity:1}}
@keyframes glitch2{0%,100%{transform:translate(0);opacity:1}20%{transform:translate(3px,-1px);opacity:.9}40%{transform:translate(-3px,2px);opacity:1}60%{transform:translate(2px,-2px);opacity:.85}80%{transform:translate(-2px,1px);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes eqAnim{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes floatNote{0%{transform:translateY(110vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:.6}100%{transform:translateY(-10vh) rotate(360deg);opacity:0}}
@keyframes needleBob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-12deg)}}

@media(max-width:600px){
  .nav-cta .btn-nav-outline{display:none}
  .search-wrap{max-width:100%}
  .btn-group{gap:10px}
  .btn{padding:12px 20px;font-size:13.5px}
}
</style>
</head>
<body>
