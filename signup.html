<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up — Stackly</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0a0418;--surface:#1a0d33;--surface2:#241048;--magenta:#ff2bd6;--violet:#7a2bff;--cyan:#00e5ff;--text:#f6f0ff;--muted:#a59bc4;--grad:linear-gradient(135deg,#ff2bd6,#7a2bff 55%,#00e5ff)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.25),transparent 70%);top:-200px;right:-200px;animation:float 9s ease-in-out infinite}
body::after{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,43,214,.22),transparent 70%);bottom:-200px;left:-200px;animation:float 11s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(40px)}}
h1,h2{font-family:'Audiowide';font-weight:400}
a{color:var(--cyan);text-decoration:none}
.grad{background:var(--grad);-webkit-background-clip:text;color:transparent}

.shell{width:100%;max-width:980px;display:grid;grid-template-columns:1fr 1.1fr;background:linear-gradient(160deg,var(--surface),var(--surface2));border:1px solid rgba(255,43,214,.2);border-radius:24px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.5);position:relative;z-index:1}
.brand{padding:50px 40px;background:linear-gradient(135deg,rgba(122,43,255,.25),rgba(255,43,214,.15));display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.brand::before{content:'';position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1493676304819-0d7a8d026dcf?w=900') center/cover;opacity:.2;mix-blend-mode:overlay}
.logo{display:flex;align-items:center;gap:12px;font-family:'Audiowide';font-size:20px;position:relative;z-index:1}
.logo-mark{width:38px;height:38px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 18px rgba(255,43,214,.5)} .logo-mark i{color:#fff;font-size:18px}
.logo span{background:var(--grad);-webkit-background-clip:text;color:transparent}
.brand h2{font-size:30px;margin-bottom:14px;position:relative;z-index:1;line-height:1.2}
.brand p{color:#e8defc;font-size:14px;position:relative;z-index:1}
.stat{margin-top:30px;display:flex;gap:24px;position:relative;z-index:1}
.stat div{font-family:'Audiowide';font-size:26px;background:var(--grad);-webkit-background-clip:text;color:transparent;line-height:1}
.stat small{display:block;color:var(--muted);font-family:'Inter';font-size:11px;text-transform:uppercase;letter-spacing:1.2px;margin-top:4px}

.form-side{padding:50px 40px;max-height:90vh;overflow-y:auto}
.form-side h1{font-size:28px;margin-bottom:8px;color:#fff}
.form-side>p{color:var(--muted);font-size:14px;margin-bottom:24px}
.roles{display:flex;gap:10px;margin-bottom:22px}
.roles label{flex:1;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(10,4,24,.5);color:#fff;text-align:center;font-size:13px;cursor:pointer;transition:.3s;display:flex;flex-direction:column;gap:6px;align-items:center}
.roles input{display:none}
.roles i{color:var(--cyan);font-size:18px}
.roles label:has(input:checked){border-color:var(--magenta);background:linear-gradient(135deg,rgba(255,43,214,.2),rgba(122,43,255,.15));box-shadow:0 8px 20px rgba(255,43,214,.2)}
.field{margin-bottom:14px}
.field label{display:block;color:#e8defc;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;font-weight:600}
.field input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(10,4,24,.5);color:#fff;font-family:inherit;font-size:14px;outline:none;transition:.3s}
.field input:focus{border-color:var(--magenta);box-shadow:0 0 0 3px rgba(255,43,214,.15)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.terms{font-size:12.5px;color:var(--muted);margin:8px 0 18px;display:flex;gap:8px;align-items:flex-start}
.btn{width:100%;padding:14px;border-radius:30px;border:none;background:var(--grad);color:#fff;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:inherit;box-shadow:0 12px 30px rgba(255,43,214,.4);transition:.3s}
.btn:hover{transform:translateY(-3px)}
.alt{text-align:center;margin-top:18px;font-size:13.5px;color:var(--muted)}

@media(max-width:760px){.shell{grid-template-columns:1fr}.brand{padding:30px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <a href="index.html" class="logo"><span class="logo-mark"><i class="fa-solid fa-music"></i></span><span>STACKLY</span></a>
    <div>
      <h2>Join the <span class="grad">Lineup</span></h2>
      <p>Create a Stackly account to book artists, stream live and sell tickets.</p>
      <div class="stat">
        <div>2.4K+<small>Live Shows</small></div>
        <div>850+<small>Artists</small></div>
        <div>120+<small>Cities</small></div>
      </div>
    </div>
    <p style="font-size:12px;color:#cfc4ea;position:relative;z-index:1">© 2026 Stackly</p>
  </div>
  <div class="form-side">
    <h1>Create <span class="grad">Account</span></h1>
    <p>Pick your role and get started in under a minute.</p>
    <form id="sf">
      <div class="roles">
        <label><input type="radio" name="role" value="customer" checked><i class="fa-solid fa-user"></i>Customer</label>
        <label><input type="radio" name="role" value="agent"><i class="fa-solid fa-headset"></i>Agent</label>
        <label><input type="radio" name="role" value="admin"><i class="fa-solid fa-shield-halved"></i>Admin</label>
      </div>
      <div class="two">
        <div class="field"><label>First Name</label><input required></div>
        <div class="field"><label>Last Name</label><input required></div>
      </div>
      <div class="field"><label>Email</label><input type="email" required></div>
      <div class="two">
        <div class="field"><label>Password</label><input type="password" required></div>
        <div class="field"><label>Confirm</label><input type="password" required></div>
      </div>
      <label class="terms"><input type="checkbox" required>I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</label>
      <button class="btn">Create Account <i class="fa-solid fa-arrow-right"></i></button>
      <p class="alt">Already have an account? <a href="login.html">Sign in</a></p>
    </form>
  </div>
</div>
<script>
document.getElementById('sf').addEventListener('submit',e=>{
  e.preventDefault();
  const r=document.querySelector('input[name=role]:checked').value;
  window.location=r+'-dashboard.html';
});
</script>
</body>
</html>
